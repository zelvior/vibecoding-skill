<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forge — Starcatch</title>
  <meta name="description" content="Starcatch: a small canvas game built with the Zelvior Vibecoding Mega Skill — motion, effects, and interactivity.">
  <meta name="theme-color" content="#1e1b4b">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231e1b4b'/><text x='50' y='72' font-size='64' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>F</text></svg>">
  <style>
    :root{--bg:#0b1020;--panel:#131a2e;--text:#eef1f8;--muted:#9aa3b8;--brand:#6366f1;--brand2:#a855f7;--accent:#22d3ee;--line:#26304f;--ok:#34d399;--warn:#fbbf24}
    *{box-sizing:border-box;margin:0}
    body{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(900px 500px at 70% -10%,rgba(99,102,241,.25),transparent),var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:28px 20px}
    .head{text-align:center;margin-bottom:18px}
    .head h1{font-size:clamp(26px,4vw,38px);letter-spacing:-.02em}
    .head h1 span{background:linear-gradient(90deg,#c7d2fe,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
    .head p{color:var(--muted);font-size:15px;margin-top:6px}
    .stage{position:relative;width:100%;max-width:520px}
    canvas{width:100%;height:auto;display:block;background:linear-gradient(180deg,#0a0f1f,#131a2e);border:1px solid var(--line);border-radius:16px;touch-action:none}
    .hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:14px;color:var(--muted)}
    .score{font-weight:700;font-size:18px;color:var(--accent)}
    .overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,12,24,.78);border-radius:16px;text-align:center;padding:20px;backdrop-filter:blur(2px)}
    .overlay.hidden{display:none}
    .overlay h2{font-size:24px;margin-bottom:8px}
    .overlay p{color:var(--muted);margin-bottom:18px;font-size:15px}
    .btn{display:inline-block;padding:12px 26px;border-radius:10px;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;border:1px solid transparent;background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff}
    .btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    .controls{margin-top:16px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .ctrl{font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:8px}
    .ctrl kbd{background:#0c1322;border:1px solid var(--line);border-radius:5px;padding:1px 7px;font-size:12px;color:var(--text)}
    @media (prefers-reduced-motion:reduce){canvas{animation:none!important}}
  </style>
</head>
<body>
  <div class="head">
    <h1>Forge <span>· Starcatch</span></h1>
    <p>Catch the stars, dodge the meteors. A canvas game built with the Zelvior Vibecoding Mega Skill.</p>
  </div>

  <div class="stage">
    <div class="hud">
      <span>Score</span>
      <span class="score" id="score">0</span>
      <span id="lives" aria-label="Lives remaining">♥♥♥</span>
    </div>
    <canvas id="game" width="520" height="640" role="img" aria-label="Starcatch game canvas. Move the basket with the mouse or arrow keys to catch stars and avoid meteors."></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Starcatch</h2>
      <p id="ovText">Move the basket to catch the stars. Avoid the meteors. How high can you go?</p>
      <button class="btn" id="startBtn" type="button">Play</button>
    </div>
  </div>

  <div class="controls">
    <span class="ctrl"><kbd>←</kbd> <kbd>→</kbd> or move the mouse</span>
    <span class="ctrl"><kbd>Space</kbd> to start</span>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ovTitle');
    const ovText = document.getElementById('ovText');
    const startBtn = document.getElementById('startBtn');

    const basket = { x: W / 2 - 40, w: 80, h: 22, y: H - 40, vx: 0, speed: 9 };
    let items = [], particles = [], score = 0, lives = 3, running = false, spawnT = 0, raf = 0, lastT = 0;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const keyState = {};
    window.addEventListener('keydown', (e) => {
      keyState[e.key] = true;
      if (e.key === ' ' && !running) startGame();
      if (['ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    });
    window.addEventListener('keyup', (e) => { keyState[e.key] = false; });

    canvas.addEventListener('pointermove', (e) => {
      const r = canvas.getBoundingClientRect();
      basket.x = (e.clientX - r.left) * (W / r.width) - basket.w / 2;
    });

    function spawn() {
      const star = Math.random() < 0.62;
      items.push({
        x: Math.random() * (W - 30) + 15,
        y: -20,
        vy: 2 + Math.random() * 2 + score / 400,
        r: star ? 11 : 16,
        star,
        rot: 0,
        vr: (Math.random() - 0.5) * 0.2
      });
    }

    function burst(x, y, color) {
      for (let i = 0; i < 14; i++) {
        const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 3;
        particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, color });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      // stars field
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      for (let i = 0; i < 40; i++) {
        const sx = (i * 97) % W, sy = (i * 53) % H;
        ctx.fillRect(sx, sy, 1, 1);
      }
      // items
      for (const it of items) {
        ctx.save();
        ctx.translate(it.x, it.y);
        ctx.rotate(it.rot);
        if (it.star) {
          ctx.fillStyle = '#fbbf24';
          ctx.beginPath();
          for (let i = 0; i < 5; i++) {
            const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
            const a2 = a + Math.PI / 5;
            ctx.lineTo(Math.cos(a) * it.r, Math.sin(a) * it.r);
            ctx.lineTo(Math.cos(a2) * it.r * 0.45, Math.sin(a2) * it.r * 0.45);
          }
          ctx.closePath(); ctx.fill();
        } else {
          ctx.fillStyle = '#f87171';
          ctx.beginPath();
          ctx.moveTo(0, -it.r); ctx.lineTo(it.r, it.r); ctx.lineTo(-it.r, it.r); ctx.closePath(); ctx.fill();
        }
        ctx.restore();
      }
      // basket
      ctx.fillStyle = '#6366f1';
      roundRect(basket.x, basket.y, basket.w, basket.h, 8); ctx.fill();
      ctx.fillStyle = '#a855f7';
      roundRect(basket.x + 6, basket.y - 8, basket.w - 12, 8, 4); ctx.fill();
      // particles
      for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
        ctx.globalAlpha = 1;
      }
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function step(t) {
      if (!running) return;
      const dt = Math.min(2, (t - lastT) / 16); lastT = t;
      // move basket
      if (keyState['ArrowLeft']) basket.vx = -basket.speed;
      else if (keyState['ArrowRight']) basket.vx = basket.speed;
      else basket.vx *= 0.8;
      basket.x += basket.vx * dt;
      basket.x = Math.max(0, Math.min(W - basket.w, basket.x));
      // spawn
      spawnT -= dt;
      if (spawnT <= 0) { spawn(); spawnT = Math.max(28, 52 - score / 30); }
      // items
      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.y += it.vy * dt; it.rot += it.vr * dt;
        // catch
        if (it.y + it.r >= basket.y && it.y - it.r <= basket.y + basket.h &&
            it.x >= basket.x && it.x <= basket.x + basket.w) {
          if (it.star) { score += 10; burst(it.x, it.y, '#fbbf24'); }
          else { lives--; burst(it.x, it.y, '#f87171'); }
          items.splice(i, 1); updateHud();
          if (lives <= 0) { endGame(); return; }
          continue;
        }
        if (it.y - it.r > H) items.splice(i, 1);
      }
      // particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt; p.life -= 0.03 * dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
      draw();
      raf = requestAnimationFrame(step);
    }

    function updateHud() {
      scoreEl.textContent = score;
      livesEl.textContent = '♥'.repeat(Math.max(0, lives));
    }

    function startGame() {
      items = []; particles = []; score = 0; lives = 3; spawnT = 30; running = true;
      updateHud();
      overlay.classList.add('hidden');
      lastT = performance.now();
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(step);
    }

    function endGame() {
      running = false;
      cancelAnimationFrame(raf);
      ovTitle.textContent = 'Game over';
      ovText.textContent = `You caught ${score} points. Play again to beat it.`;
      startBtn.textContent = 'Play again';
      overlay.classList.remove('hidden');
    }

    startBtn.addEventListener('click', startGame);
    draw();
  </script>
</body>
</html>
